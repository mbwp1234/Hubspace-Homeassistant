---
send_command:
  description: Send a Command To Hubspace Cloud
  target:
    entity:
      integration: hubspace
      domain:
        - button
        - climate
        - fan
        - light
        - lock
        - switch
        - valve
  fields:
    account:
      name: account
      description: |
        Username associated with the device. If not present, it will
        use the first Hubspace instance
      required: false
      example: your.email@gmail.com
    value:
      name: value
      description: value you want to send
      required: true
      example: "on"
    function_class:
      name: function_class
      description: functionClass you want to send
      required: true
      example: "power"
    function_instance:
      name: function_instance
      description: functionInstance you want to send
      required: false
      example: "primary"

afero_request:
  description: Fork-only diagnostic. One signed request to the raw Afero API for the logged-in account.
  fields:
    path:
      description: Path under /v1/accounts/{account}/
      required: true
      example: "/v1/accounts/{account}/deviceProfiles/<profile-id>"
    method:
      description: GET or POST
      required: false
      example: "GET"
    body:
      description: JSON body for POST
      required: false
    account:
      description: Username, if more than one Hubspace account
      required: false
